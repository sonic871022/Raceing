<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Racing - 加油！</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --corner: #f59e0b;
      --pit: #10b981;
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 1.5rem;
    }
    .panels {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .panel {
      background: var(--panel);
      border-radius: 10px;
      padding: 16px;
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #374151;
    }
    .stat:last-child {
      border-bottom: none;
    }
    .stat span:last-child {
      font-weight: 600;
    }
    .message {
      margin-top: 12px;
      padding: 10px 12px;
      background: #111827;
      border-radius: 6px;
      min-height: 1.5em;
    }
    .track {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      max-width: 640px;
      margin-top: 8px;
    }
    .pit-lane {
      display: flex;
      gap: 6px;
      max-width: 640px;
      margin-bottom: 8px;
      padding: 8px;
      background: #1f2937;
      border-radius: 8px;
      align-items: center;
    }
    .pit-lane-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-right: 6px;
    }
    .pit-cell {
      flex: 1;
      max-width: 72px;
      aspect-ratio: 1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      background: #374151;
      position: relative;
      font-size: 0.85rem;
    }
    .pit-cell.pit {
      background: #8b5cf6;
      color: #fff;
    }
    .pit-cell.pit-track {
      background: var(--pit);
      color: #111827;
    }
    .pit-cell .car {
      font-size: 1.5rem;
      line-height: 1;
    }
    .cell {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      background: #374151;
      position: relative;
      font-size: 0.85rem;
    }
    .cell.corner {
      background: var(--corner);
      color: #111827;
    }
    .cell.pit {
      background: var(--pit);
      color: #111827;
    }
    .cell.limit {
      background: var(--danger);
      color: #fff;
      font-size: 1rem;
    }
    .cell.green {
      background: #10b981;
      color: #111827;
    }
    .cell .car {
      font-size: 1.5rem;
      line-height: 1;
    }
    .cell .index {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 0.65rem;
      font-weight: 400;
      opacity: 0.7;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 1rem;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-advance {
      background: #10b981;
    }
    .btn-advance:hover:not(:disabled) {
      background: #059669;
    }
    .btn-end-turn {
      background: #ef4444;
    }
    .btn-end-turn:hover:not(:disabled) {
      background: #dc2626;
    }
    .reset {
      background: var(--danger);
    }
    .reset:hover:not(:disabled) {
      background: #dc2626;
    }
    .status-won { color: #34d399; }
    .status-failed { color: var(--danger); }
    .status-playing { color: #60a5fa; }
    .active-player {
      font-size: 1.1rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .active-player.player-0 { color: #60a5fa; }
    .active-player.player-1 { color: #f472b6; }
    .players-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .player-info {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-radius: 6px;
      background: #374151;
      font-size: 0.85rem;
    }
    .player-info.active {
      border: 2px solid var(--accent);
    }
    .player-info.player-0.active {
      border-color: #60a5fa;
    }
    .player-info.player-1.active {
      border-color: #f472b6;
    }
    .player-icon {
      font-size: 1.2rem;
    }
    .player-name {
      font-weight: 700;
    }
    .player-stat {
      color: var(--muted);
    }
    .player-stun {
      color: var(--danger);
      font-weight: 700;
    }
    .car-0 { color: #60a5fa; }
    .car-1 { color: #f472b6; }
  </style>
</head>
<body>
  <h1>Racing - 加油！</h1>

  <div class="panels">
    <div class="panel">
      <h2>当前操作</h2>
      <div class="stat"><span>状态</span><span id="status">loading</span></div>
      <div class="stat"><span>当前玩家</span><span id="active-player" class="active-player">-</span></div>
      <div class="stat"><span>圈数</span><span id="lap">-</span></div>
      <div class="stat"><span>位置</span><span id="position">-</span></div>
      <div class="stat"><span>车速</span><span id="speed">-</span></div>
      <div class="stat"><span>油量</span><span id="fuel">-</span></div>
      <div class="stat"><span>本回合骰子</span><span id="roll">-</span></div>
      <div class="stat"><span>完美刹车</span><span id="perfect-brake">-</span></div>
      <div class="stat"><span>休整回合</span><span id="stun-turns">-</span></div>
      <div class="stat"><span>总回合</span><span id="turn">-</span></div>
    </div>

    <div class="panel">
      <h2>玩家状态</h2>
      <div id="players-info" class="players-info">加载中…</div>
    </div>

    <div class="panel">
      <h2>赛道</h2>
      <div id="pit-lane" class="pit-lane"></div>
      <div id="track" class="track">加载中…</div>
    </div>

    <div class="panel">
      <h2>操作</h2>
      <div id="actions" class="actions">
        <button disabled>加载中…</button>
      </div>
      <div id="message" class="message">-</div>
    </div>
  </div>

  <button id="reset" class="reset">重置对局</button>

  <script src="app.js"></script>
</body>
</html>
